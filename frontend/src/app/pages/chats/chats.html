<div class="chat-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="menu-icon">☰</div>
      <input type="text" placeholder="Поиск" class="search-input">
    </div>

    <ul class="chat-list">
      <li class="chat-item active">
        <div class="avatar blue">Т</div>
        <div class="chat-info">
          <div class="chat-header">
            <span class="chat-name">teamlead</span>
            <span class="chat-time">12:00</span>
          </div>
          <span class="chat-last-message">Architek aprove</span>
        </div>
      </li>
      <li class="chat-item">
        <div class="avatar purple">Б</div>
        <div class="chat-info">
          <div class="chat-header">
            <span class="chat-name">Backend</span>
            <span class="chat-time">Yesterday</span>
          </div>
          <span class="chat-last-message">Tokens work!</span>
        </div>
      </li>
    </ul>

    <button class="logout-btn" (click)="logout()">Exit from account</button>
  </aside>

  <main class="chat-area">
    <div class="chat-placeholder">
      <span>Select chat</span>
    </div>
  </main>
</div>
