name: university-messenger-aws

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30]
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    mem_limit: 384m
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: [npm, run, migrate:apply]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  backend:
    mem_limit: 384m
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
      AUTH_COOKIE_PATH: /api/auth
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/docs-json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  web:
    mem_limit: 64m
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  database:
  certificates:
  caddy_config:
