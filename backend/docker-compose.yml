name: messenger-backend

services:
  db:
    image: postgres:18.6-alpine
    container_name: messenger-db
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-shard-1:
    image: postgres:18.6-alpine
    profiles: [sharding]
    restart: on-failure:3
    environment:
      POSTGRES_DB: messenger-messages-1
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MESSAGE_SHARD_1_PORT:-6013}:5432"
    volumes:
      - shard_1_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d messenger-messages-1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-shard-2:
    image: postgres:18.6-alpine
    profiles: [sharding]
    restart: on-failure:3
    environment:
      POSTGRES_DB: messenger-messages-2
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MESSAGE_SHARD_2_PORT:-6014}:5432"
    volumes:
      - shard_2_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d messenger-messages-2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  shard_1_data:
  shard_2_data:
